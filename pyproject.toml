[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmeeeg"
version = "0.5.0"
description = "Minimal Python implementation of lmeEEG for random-intercept mass-univariate M/EEG analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hiro YAMASAKI", email = "hiroyoshi.YAMASAKI@univ-amu.fr"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "rich>=13.0",
]

[project.optional-dependencies]
mne = ["mne>=1.5"]
pymer4 = [
    "pymer4>=0.9,<0.10",
    "rpy2>=3.6,<3.7",
    "polars>=1.0",
    "pyarrow>=15",
    "great-tables>=0.17",
    "scikit-learn>=1.4",
    "formulae>=0.5",
]
julia = [
    "juliacall==0.9.35",
]
docs = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design>=0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running validation/calibration tests",
]

[tool.lmeeeg.pymer4]
supported_pymer4 = ">=0.9,<0.10"
verified_r = "4.5.3"
verified_r_packages = {lme4 = "2.0.1", lmerTest = "3.2.1", emmeans = "2.0.3", report = "0.6.4"}
